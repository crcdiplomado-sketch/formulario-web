<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos Académicos</title>
    <style>
        body {
            background-color: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .form-container {
            background-color: #0b1120;
            border: 2px solid #00f0ff;
            border-radius: 14px;
            padding: 35px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            box-sizing: border-box;
        }

        h2 {
            color: #ff007f;
            font-size: 24px;
            margin-top: 0;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #fde047;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #00f0ff;
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 11px;
            background-color: #05070d;
            border: 1px solid #1e3a8a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-submit {
            flex: 2;
            background-color: #00f0ff;
            color: #05070d;
            border: none;
            padding: 13px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #00c4d1;
        }

        .btn-reset {
            flex: 1;
            background-color: #ff007f;
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background-color: #d9006b;
        }

        #mensaje-exito {
            display: none;
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #059669;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>REGISTRO DE DATOS ACADÉMICOS</h2>
        <div class="subtitle">Control de Estudiantes</div>

        <div id="mensaje-exito">¡Registro guardado con éxito! Los datos han sido enviados.</div>
        
        <form id="academicForm">
            <div class="form-group">
                <label>Nombre Completo (Apellidos y Nombres)</label>
                <input type="text" id="nombre" required placeholder="Ej. Pérez Gómez, Juan Carlos">
            </div>

            <div class="form-group">
                <label>Cédula de Identidad</label>
                <input type="text" id="cedula" required placeholder="Ej. V-12345678">
            </div>

            <div class="form-group">
                <label>Edad</label>
                <input type="number" id="edad" min="15" max="90" required placeholder="Ej. 20">
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="estudiante@ejemplo.com">
            </div>

            <div class="form-group">
                <label>Lugar de Residencia</label>
                <input type="text" id="residencia" required placeholder="Ciudad, Estado / Dirección">
            </div>

            <div class="form-group">
                <label>Número de Teléfono</label>
                <input type="tel" id="telefono" required placeholder="0414-1234567">
            </div>

            <div class="form-group">
                <label>Subproyecto que Cursa</label>
                <select id="subproyecto" required>
                    <option value="">-- Seleccionar Subproyecto --</option>
                    <option value="Subproyecto A">Subproyecto A</option>
                    <option value="Subproyecto B">Subproyecto B</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sección</label>
                <select id="seccion" required>
                    <option value="">-- Seleccionar Sección --</option>
                    <option value="Sección 1">Sección 1</option>
                    <option value="Sección 2">Sección 2</option>
                </select>
            </div>

            <div class="form-group">
                <label>Otra Información Importante</label>
                <textarea id="info" rows="3" placeholder="Observaciones o notas adicionales..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit" id="btnEnviar">GUARDAR REGISTRO</button>
                <button type="reset" class="btn-reset">LIMPIAR</button>
            </div>
        </form>
    </div>

    <script>
        // PEGA AQUÍ ABAJO LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT:
        const URL_APLICACION = "https://script.google.com/macros/s/AKfycbylOKNYRfbdamlJA4wSmkoGXJPnC18QeqOtNk8plZLlJOz1HTFUl6mTMpQ8azkiTtI/exec";

        const formulario = document.getElementById('academicForm');
        const mensajeExito = document.getElementById('mensaje-exito');
        const btnEnviar = document.getElementById('btnEnviar');

        formulario.addEventListener('submit', function(e) {
            e.preventDefault();
            
            btnEnviar.disabled = true;
            btnEnviar.textContent = "ENVIANDO...";

            const datos = {
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                edad: document.getElementById('edad').value,
                correo: document.getElementById('correo').value,
                residencia: document.getElementById('residencia').value,
                telefono: document.getElementById('telefono').value,
                subproyecto: document.getElementById('subproyecto').value,
                seccion: document.getElementById('seccion').value,
                info: document.getElementById('info').value
            };

            fetch(URL_APLICACION, {
                method: "POST",
                mode: "no-cors", // Necesario para evitar bloqueos cruzados con Google
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                mensajeExito.style.display = "block";
                formulario.reset();
                btnEnviar.disabled = false;
                btnEnviar.textContent = "GUARDAR REGISTRO";
                
                setTimeout(() => {
                    mensajeExito.style.display = "none";
                }, 5000);
            })
            .catch((error) => {
                console.error("Error:", error);
                alert("Hubo un error al enviar los datos. Inténtalo de nuevo.");
                btnEnviar.disabled = false;
                btnEnviar.textContent = "GUARDAR REGISTRO";
            });
        });
    </script>
</body>
</html>
